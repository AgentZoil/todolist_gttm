name: Daily database backup to Google Drive

on:
  workflow_dispatch:
  schedule:
    # 20:15 UTC = 03:15 the following day in Asia/Ho_Chi_Minh.
    - cron: '15 20 * * *'

permissions:
  contents: read

concurrency:
  group: database-backup-google-drive
  cancel-in-progress: false

jobs:
  backup:
    # Enable scheduled runs only after configuring secrets and a successful trial.
    if: vars.DRIVE_BACKUP_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check backup failure handling
        run: python3 scripts/test_backup_google_drive.py

      - name: Install verified rclone release
        env:
          RCLONE_VERSION: v1.75.2
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/rclone-install"
          mkdir -p "$install_dir"
          cd "$install_dir"
          archive="rclone-${RCLONE_VERSION}-linux-amd64.zip"
          base="https://github.com/rclone/rclone/releases/download/${RCLONE_VERSION}"
          curl --fail --location --retry 3 --output "$archive" "$base/$archive"
          curl --fail --location --retry 3 --output SHA256SUMS "$base/SHA256SUMS"
          grep -E " [*]?${archive//./\\.}$" SHA256SUMS | sha256sum --check --strict
          unzip -q "$archive"
          mkdir -p "$RUNNER_TEMP/backup-bin"
          install -m 0755 "rclone-${RCLONE_VERSION}-linux-amd64/rclone" "$RUNNER_TEMP/backup-bin/rclone"
          echo "$RUNNER_TEMP/backup-bin" >> "$GITHUB_PATH"

      - name: Export, encrypt, upload and verify database
        env:
          SUPABASE_BACKUP_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          RCLONE_BACKUP_CONFIG: ${{ secrets.RCLONE_BACKUP_CONFIG }}
          POSTGRES_BACKUP_IMAGE: postgres:17-alpine
        run: bash scripts/backup-google-drive.sh
